# Included in every location: nginx drops server-level add_header directives
# in any location that declares its own add_header.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Geolocation is used by the SOS location picker and technician directions.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
