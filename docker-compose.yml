# SewaSync local container stack: the production SPA image and a standalone Redis.
#
# Supabase is NOT defined here. The Supabase CLI (`supabase start`) runs its own
# containers on the `supabase_network_SewaSyncx` network and publishes them on
# the host (API 127.0.0.1:54321, Postgres 127.0.0.1:54322). The stack bridges to
# it through the host rather than joining that network, so `docker compose up`
# works whether or not Supabase is running:
#   - The SPA runs in the browser, so VITE_SUPABASE_URL must be a URL the
#     browser can reach (http://127.0.0.1:54321), never a container hostname.
#   - Containers reach Supabase at http://host.docker.internal:54321 and
#     postgresql://postgres:postgres@host.docker.internal:54322/postgres.
#
# Values are read from .env (optional; see .env.example).

name: sewasync

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Baked into the bundle at build time. Rebuild after changing them.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://127.0.0.1:54321}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: sewasync-web:local
    ports:
      # 3000 is the technician dev server's port; 8080 avoids the clash.
      - "${WEB_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-sewasync_local_dev}
    environment:
      # Lets redis-cli inside the container authenticate without -a, which keeps
      # the password out of the healthcheck command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-sewasync_local_dev}
    ports:
      # Loopback only: a well-known dev password must not be reachable from the LAN.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
      start_interval: 1s
    restart: unless-stopped

volumes:
  redis_data: {}
